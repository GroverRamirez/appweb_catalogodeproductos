name: CI

# Corre en todo push y en pull requests hacia cualquier rama.
# Para limitar a ramas específicas, añadir:
#   branches: [main, develop]
on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: PHP ${{ matrix.php }} — MySQL 8.0
    runs-on: ubuntu-latest

    # ── Versión de PHP ──────────────────────────────────────────────────────────
    strategy:
      fail-fast: true
      matrix:
        php: ['8.3']

    # ── Servicio MySQL ──────────────────────────────────────────────────────────
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_secret
          MYSQL_DATABASE: testing
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # ── Variables de entorno para el job completo ────────────────────────────────
    # Estas toman precedencia sobre los <env> de phpunit.xml (que no usan force="true"),
    # así los tests corren contra MySQL aunque phpunit.xml declare sqlite como default.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: ci
      DB_PASSWORD: ci_secret
      # Acelerar bcrypt en tests
      BCRYPT_ROUNDS: 4

    steps:
      # ── 1. Código fuente ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── 2. PHP ───────────────────────────────────────────────────────────────
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: >-
            pdo_mysql, gd, mbstring, xml, bcmath, intl, zip, fileinfo
          tools: composer:v2
          # Desactivar cobertura en CI acelera ~30 % la ejecución de tests.
          # Para reportes de cobertura cambiar a: xdebug
          coverage: none

      # ── 3. Cache Composer ─────────────────────────────────────────────────────
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-php${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ── 4. Node / npm ─────────────────────────────────────────────────────────
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'          # usa package-lock.json como cache key automáticamente

      - name: Install npm dependencies
        run: npm ci

      # ── 5. Entorno Laravel ────────────────────────────────────────────────────
      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # Limpiar config para que Laravel use las env vars del runner (no el .env)
      - name: Clear config cache
        run: php artisan config:clear

      # ── 6. Build de assets (Vite) ─────────────────────────────────────────────
      - name: Build frontend assets
        run: npm run build

      # ── 7. TypeScript type-check ──────────────────────────────────────────────
      - name: TypeScript check
        run: npm run types:check

      # ── 8. Base de datos ──────────────────────────────────────────────────────
      # RefreshDatabase corre las migraciones por sí solo en cada test class,
      # pero ejecutarlo aquí garantiza que la conexión funciona y que el schema
      # arranca limpio antes de que Pest tome el control.
      - name: Run migrations
        run: php artisan migrate --force

      # ── 9. Tests ──────────────────────────────────────────────────────────────
      - name: Run Pest tests
        run: ./vendor/bin/pest --ci --stop-on-failure
