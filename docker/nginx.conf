user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Upload size — must match php.ini upload_max_filesize
    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    server {
        listen 80 default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php;

        # ── Vite build assets — immutable cache (content-hashed filenames)
        location ~* ^/build/assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Public storage (uploaded images, etc.)
        location /storage/ {
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # ── SPA / Laravel routing
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── PHP-FPM
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include       fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # ── Block hidden files (.env, .git, etc.)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
