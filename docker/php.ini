; ─────────────────────────────────────────────────────────────────────────────
; Production PHP overrides for Catálogo de Productos
; Loaded as /usr/local/etc/php/conf.d/99-app.ini
; ─────────────────────────────────────────────────────────────────────────────

; Security
expose_php = Off

; Memory & limits
memory_limit       = 256M
max_execution_time = 60
max_input_time     = 60

; Upload
upload_max_filesize = 25M
post_max_size       = 25M
max_file_uploads    = 20

; Timezone
date.timezone = America/Lima

; Error handling — log only, never display
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /dev/stderr
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ─── OPcache ──────────────────────────────────────────────────────────────────
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 20000
opcache.revalidate_freq         = 0
; validate_timestamps=0 for immutable containers (faster)
opcache.validate_timestamps     = 0
opcache.save_comments           = 1
opcache.fast_shutdown           = 1

; ─── Realpath cache (bigger = faster for many files) ─────────────────────────
realpath_cache_size = 4096K
realpath_cache_ttl  = 600

; ─── Session ──────────────────────────────────────────────────────────────────
; Sessions are managed by Laravel/Redis — these are fallback defaults
session.gc_maxlifetime = 14400
