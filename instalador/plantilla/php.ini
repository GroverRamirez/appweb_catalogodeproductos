; php.ini de la version portable de PC Store Pro.
; Vive al lado de php.exe: PHP lo toma solo, y la carpeta "ext" se resuelve
; contra el propio directorio de PHP (por eso no se declara extension_dir: una
; ruta absoluta se romperia al instalar la app en otra carpeta).

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 24M
date.timezone = America/La_Paz

; Errores a archivo, nunca a pantalla: es una demo para un usuario final.
display_errors = Off
log_errors = On

extension=curl
extension=exif
extension=fileinfo
extension=gd
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip
